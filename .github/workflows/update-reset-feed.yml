name: Update reset feed

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-reset-feed
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Update official sources and optional Google Alerts RSS
        run: |
          npm run update-reset-feed
        env:
          GOOGLE_ALERT_RSS_URL: ${{ secrets.GOOGLE_ALERT_RSS_URL }}
      - name: Commit feed update
        run: |
          if git diff --quiet -- docs/reset-feed.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reset-feed.json
          git commit -m "chore: update reset feed"
          git push
