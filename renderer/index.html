<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <title>Quota Glance</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="titlebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <div>
            <h1>Quota Glance</h1>
            <p><span id="status-dot" class="status-dot"></span><span id="status-text">読み込み中</span></p>
          </div>
        </div>
        <div class="window-actions">
          <button id="lang-button" class="icon-button language-button" aria-label="Switch to English" title="Switch to English">EN</button>
          <button id="minimum-mode-button" class="icon-button minimum-mode-button" aria-label="ミニマムモードに切り替え" title="ミニマムモードに切り替え">MIN</button>
          <button id="pin-button" class="icon-button" aria-label="常に手前に表示" title="常に手前に表示">◆</button>
          <button id="minimize-button" class="icon-button" aria-label="最小化" title="最小化">−</button>
          <button id="close-button" class="icon-button" aria-label="トレイに隠す" title="トレイに隠す">×</button>
        </div>
      </header>

      <section class="status-strip" aria-label="System status">
        <span>C <b id="metric-drive">--</b></span><span>GPU <b id="metric-gpu">--</b></span><span>CPU <b id="metric-cpu">--</b></span><span>MEM <b id="metric-mem">--</b></span><span>TEMP <b id="metric-temp">--</b></span>
      </section>

      <section class="balance-card">
        <p id="balance-label" class="eyebrow">残高・残りクレジット</p>
        <div class="balance-row">
          <strong id="credit-balance">—</strong>
          <span id="credit-unit">credits</span>
        </div>
        <p id="credit-note" class="subtle">最新情報を確認しています</p>
      </section>

      <section class="usage-card">
        <div class="section-heading">
          <div>
            <p id="five-hour-label" class="eyebrow">5時間利用上限</p>
            <strong id="five-hour-summary">—</strong>
          </div>
          <span id="five-hour-badge" class="badge">—</span>
        </div>
        <div id="five-hour-progress-track" class="progress-track" role="progressbar" aria-label="5時間利用量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="five-hour-progress-fill" class="progress-fill"></div>
        </div>
        <div class="usage-meta">
          <span id="five-hour-reset-time">—</span>
          <span id="five-hour-countdown">—</span>
        </div>
      </section>

      <section class="usage-card">
        <div class="section-heading">
          <div>
            <p id="weekly-label" class="eyebrow">週間利用上限</p>
            <strong id="weekly-summary">—</strong>
          </div>
          <span id="weekly-badge" class="badge">—</span>
        </div>
        <div id="weekly-progress-track" class="progress-track" role="progressbar" aria-label="週間利用量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="weekly-progress-fill" class="progress-fill"></div>
        </div>
        <div class="usage-meta">
          <span id="weekly-reset-time">—</span>
          <span id="weekly-countdown">—</span>
        </div>
        <div id="reset-alert" class="reset-alert" hidden>
          <span id="reset-alert-text"></span>
          <button id="reset-alert-link" class="reset-alert-link" type="button">X</button>
        </div>
      </section>

      <section class="refresh-settings" aria-labelledby="refresh-interval-label">
        <div class="refresh-settings-heading">
          <label id="refresh-interval-label" for="refresh-interval">更新頻度</label>
          <output id="refresh-interval-value" for="refresh-interval">5秒</output>
        </div>
        <input id="refresh-interval" type="range" min="1" max="60" step="1" value="5" aria-label="更新頻度" />
        <div class="refresh-settings-heading opacity-heading"><label id="opacity-label" for="opacity">透明度</label><output id="opacity-value">100%</output></div>
        <input id="opacity" type="range" min="40" max="100" step="1" value="100" aria-label="透明度" />
      </section>

      <footer>
        <button id="source-button" class="source-button" title="取得元ファイルを表示">
          <span id="updated-at">最終取得 —</span>
          <span id="plan-label">—</span>
        </button>
        <button id="refresh-button" class="refresh-button">更新</button>
      </footer>
      <p id="error-message" class="error-message" hidden></p>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
